name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test:workspace

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Run Rust lints
        working-directory: src-tauri
        run: cargo clippy --lib --tests --locked -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo dependencies
        working-directory: src-tauri
        run: cargo audit

  release:
    name: Build and publish Linux release
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bindars ${{ github.ref_name }}'
          releaseBody: |
            Linux is the currently supported release platform.

            This build is manually tested on Omarchy (Arch-based Linux) and
            built in CI on Ubuntu 22.04. Ubuntu, Linux Mint, and Debian 12 or
            newer are expected to work but have not been manually verified
            for this release.

            Windows and macOS binaries are not included while native testing
            and code signing remain pending.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
