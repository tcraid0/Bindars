name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test:workspace

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Run Rust lints
        working-directory: src-tauri
        run: cargo clippy --lib --tests --locked -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo dependencies
        working-directory: src-tauri
        run: cargo audit

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Apple signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          BINDARS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          BINDARS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BINDARS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BINDARS_APPLE_ID: ${{ secrets.APPLE_ID }}
          BINDARS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          BINDARS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          values=(
            "$BINDARS_APPLE_CERTIFICATE"
            "$BINDARS_APPLE_CERTIFICATE_PASSWORD"
            "$BINDARS_APPLE_SIGNING_IDENTITY"
            "$BINDARS_APPLE_ID"
            "$BINDARS_APPLE_PASSWORD"
            "$BINDARS_APPLE_TEAM_ID"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::Apple signing secrets must be single-line values."
              exit 1
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "Apple signing secrets are not configured; building unsigned."
            exit 0
          fi
          if [[ "$configured" -ne "${#values[@]}" ]]; then
            echo "::error::Apple signing is partially configured. Set all six APPLE_* repository secrets or remove all six."
            exit 1
          fi

          {
            printf 'APPLE_CERTIFICATE=%s\n' "$BINDARS_APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$BINDARS_APPLE_CERTIFICATE_PASSWORD"
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$BINDARS_APPLE_SIGNING_IDENTITY"
            printf 'APPLE_ID=%s\n' "$BINDARS_APPLE_ID"
            printf 'APPLE_PASSWORD=%s\n' "$BINDARS_APPLE_PASSWORD"
            printf 'APPLE_TEAM_ID=%s\n' "$BINDARS_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bindars ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Bindars.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
