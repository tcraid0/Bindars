name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: node --test tests/version-consistency.test.cjs

      - name: Fetch locked Rust dependency sources
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Test third-party notice generation
        run: npm run licenses:test

      - name: Verify third-party notices
        run: npm run licenses:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test:workspace

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Run Rust lints
        working-directory: src-tauri
        run: cargo clippy --lib --tests --locked -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  package:
    name: Build and validate Debian package
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: node --test tests/version-consistency.test.cjs

      - name: Fetch locked Rust dependency sources
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Verify third-party notices
        run: npm run licenses:check

      - name: Build Debian package
        run: npm run tauri -- build --bundles deb --ci

      - name: Inspect Debian package
        run: scripts/verify-deb-package.sh src-tauri/target/release/bundle/deb release-artifacts

      - name: Install and smoke-test Debian package
        run: |
          deb_path="$(find release-artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)"
          deb_path="$(realpath "$deb_path")"
          sudo apt-get install -y "$deb_path"
          dpkg-query -L bindars > release-artifacts/installed-files.txt

          installed_notice="$(dpkg-query -L bindars | grep '/THIRD-PARTY-NOTICES$')"
          test -n "$installed_notice"
          cmp THIRD-PARTY-NOTICES "$installed_notice"

          set +e
          timeout 20s dbus-run-session -- xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 /usr/bin/bindars > release-artifacts/smoke-test.log 2>&1
          smoke_status=$?
          set -e

          if [ "$smoke_status" -ne 124 ]; then
            cat release-artifacts/smoke-test.log
            echo "Bindars exited unexpectedly during the smoke test (status $smoke_status)." >&2
            exit 1
          fi

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: bindars-deb-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified Debian release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: bindars-deb-${{ github.sha }}
          path: release-artifacts

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/*.deb \
            release-artifacts/SHA256SUMS \
            --verify-tag \
            --title "Bindars $GITHUB_REF_NAME" \
            --notes-file .github/release-body.md \
            "${release_flags[@]}"
