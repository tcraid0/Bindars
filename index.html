<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var themes = ["light", "sepia", "dark", "deep-dark"];
        var theme = "light";
        var colors = {
          light:       { bg: "#FAFAF8", text: "#665F5B", indicator: "#2475CD" },
          sepia:       { bg: "#F3EACE", text: "#65584A", indicator: "#644327" },
          dark:        { bg: "#17181A", text: "#A0A2A6", indicator: "#56A3FE" },
          "deep-dark": { bg: "#0A0A0C", text: "#95979B", indicator: "#56A3FE" }
        };

        try {
          var stored = localStorage.getItem("bindars-theme") || localStorage.getItem("markdown-reader-theme");
          if (stored && themes.indexOf(stored) !== -1) {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (_error) {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        }

        var root = document.documentElement;
        var c = colors[theme];
        root.setAttribute("data-theme", theme === "light" ? "" : theme);
        root.style.backgroundColor = c.bg;
        root.style.setProperty("--ls-bg", c.bg);
        root.style.setProperty("--ls-text", c.text);
        root.style.setProperty("--ls-indicator", c.indicator);

        // Reduced motion applies from the first frame: the macOS setting, or Reduce
        // effects saved by Bindars. App.tsx keeps this class current once it mounts.
        var reduce = false;
        try {
          reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (_error) {}
        // Like useReaderSettings, use the first record with at least one usable setting.
        // The theme test checks this pre-paint eligibility copy against normalizeReaderSettings.
        var keys = ["bindars-settings", "markdown-reader-settings"];
        for (var i = 0; !reduce && i < keys.length; i++) {
          try {
            var settings = JSON.parse(localStorage.getItem(keys[i]));
            if (!settings || typeof settings !== "object" || Array.isArray(settings)) continue;
            var usable = ["fontSize", "contentWidth", "lineHeight"].some(function (key) {
              return typeof settings[key] === "number" && Number.isFinite(settings[key]);
            }) || ["sceneLensEnabled", "reducedEffects"].some(function (key) {
              return typeof settings[key] === "boolean";
            }) || ["newsreader", "source-sans-3", "dm-sans", "roboto-slab", "atkinson", "opendyslexic"].indexOf(settings.fontFamily) !== -1
              || ["compact", "comfortable", "spacious"].indexOf(settings.paragraphSpacing) !== -1;
            if (!usable) continue;
            reduce = settings.reducedEffects === true;
            break;
          } catch (_error) {}
        }
        if (reduce) root.classList.add("reduced-motion");
      })();
    </script>
    <style>
      #loading-screen {
        --ls-center-y: 47%;
        --ls-mark-size: 112px;
        --ls-feedback-delay: 900ms;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: var(--ls-bg, #FAFAF8);
        transition: opacity 200ms ease-out;
      }
      #loading-screen.fade-out { opacity: 0; }
      /* The app icon, a little above the middle. Margins centre it so the exit
         can use transform. The mark leaves just ahead of the background, so it
         barely overlaps the app underneath. */
      #loading-screen-mark {
        position: absolute;
        left: 50%;
        top: var(--ls-center-y);
        display: block;
        width: var(--ls-mark-size);
        height: var(--ls-mark-size);
        margin: calc(var(--ls-mark-size) / -2) 0 0 calc(var(--ls-mark-size) / -2);
        transition: opacity 140ms ease-out, transform 140ms ease-out;
      }
      #loading-screen.fade-out #loading-screen-mark {
        opacity: 0;
        transform: scale(0.985);
      }
      /* Loading feedback is for slow starts only: nothing shows before 0.9 s.
         Both sit outside the layout, so their arrival never moves the mark. */
      #loading-screen-progress,
      #loading-screen-status {
        position: absolute;
        opacity: 0;
      }
      #loading-screen-progress {
        left: 50%;
        top: calc(var(--ls-center-y) + var(--ls-mark-size) / 2 + 30px);
        width: 44px;
        height: 2px;
        transform: translateX(-50%);
        border-radius: 1px;
        overflow: hidden;
        background: color-mix(in srgb, var(--ls-text) 16%, transparent);
        animation: ls-appear 400ms ease-out var(--ls-feedback-delay) forwards;
      }
      #loading-screen-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--ls-indicator);
        animation: ls-slide 1.5s cubic-bezier(0.45, 0, 0.55, 1) var(--ls-feedback-delay) infinite both;
      }
      #loading-screen-status {
        display: none;
        left: 0;
        right: 0;
        top: calc(var(--ls-center-y) + var(--ls-mark-size) / 2 + 24px);
        margin: 0;
        text-align: center;
        font: 12px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: var(--ls-text);
        animation: ls-appear 200ms ease-out var(--ls-feedback-delay) forwards;
      }
      @keyframes ls-appear {
        to { opacity: 1; }
      }
      @keyframes ls-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      /* Reduced motion: nothing moves or loops. A slow start shows the word
         instead of the sliding line, and the exit is a short dissolve. */
      .reduced-motion #loading-screen { transition-duration: 150ms; }
      .reduced-motion #loading-screen-mark { transition: opacity 100ms ease-out; }
      .reduced-motion #loading-screen.fade-out #loading-screen-mark { transform: none; }
      .reduced-motion #loading-screen-progress { display: none; }
      .reduced-motion #loading-screen-status { display: block; }
    </style>
    <title>Bindars</title>
  </head>
  <body>
    <div id="loading-screen">
      <!-- The viewBox is the artwork's bounds in assets/brand/bindars-icon.svg; update both together. -->
      <svg id="loading-screen-mark" viewBox="239 239.28 546 545.5" role="img" aria-label="Bindars"><!-- startup mark --></svg>
      <div id="loading-screen-progress" aria-hidden="true"></div>
      <p id="loading-screen-status" aria-hidden="true">Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
