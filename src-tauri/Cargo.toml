[package]
name = "bindars"
version = "1.6.2"
description = "Read markdown beautifully"
authors = ["Thomas Coffman"]
license = "MIT"
repository = "https://github.com/tcraid0/bindars"
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dunce = "1"
percent-encoding = "2"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
log = "0.4"
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"
notify = "8.2.1"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std", "NSObject", "NSGeometry",
  "NSDictionary", "NSString", "NSUserDefaults", "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSView"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }
dispatch2 = "0.3"

[dev-dependencies]
tauri = { version = "~2.12.5", features = ["test"] }
