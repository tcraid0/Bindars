# Reviewed allowlist for cargo-audit.
# Most entries are legacy transitive dependencies from Tauri's Linux
# WebKit/GTK stack or its build-time HTML tooling. Bindars does not use the
# affected APIs directly. Each exception is documented beside its entry, and
# the entries should disappear as upstream dependency trees modernize.
#
# RUSTSEC-2026-0097 (rand 0.7.3) remains visible as an audit warning rather
# than being hidden here. It is build-only through phf_generator/selectors and
# Bindars does not install the custom logger required to trigger the advisory.
#
# Last reviewed: 2026-08-28

[advisories]
ignore = [
    # GTK3 bindings — unmaintained
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0419", # gtk3-macros

    # glib unsoundness (VariantStrIter) — Bindars does not use this API
    "RUSTSEC-2024-0429", # glib

    # Legacy build-time/parser dependencies
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained, build dep only)
    "RUSTSEC-2024-0384", # instant (unmaintained, Tauri transitive)
    "RUSTSEC-2025-0057", # fxhash (unmaintained, wry/selectors transitive)
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # Inactive optional dependency declared by rust_decimal. Bindars reaches
    # rust_decimal through tauri-plugin-log -> byte-unit, but does not enable
    # rust_decimal's rkyv feature; cargo tree --target all -i rkyv@0.7.46
    # confirms there is no compiled dependency path. cargo-audit scans every
    # Cargo.lock entry without resolving enabled features.
    "RUSTSEC-2026-0235", # rkyv 0.7.46
]
