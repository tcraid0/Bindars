# Reviewed against Tauri 2.12.5 and the locked desktop dependency graph.
# Last reviewed: 2026-11-01 (RustSec database 2295466c4e9df26647fd67d8fa1c705ac2fc7f81).
# Checked aarch64-apple-darwin, x86_64-unknown-linux-gnu,
# x86_64-pc-windows-msvc and --target all. Runtime classification excludes
# build dependencies and proc-macro paths. Reassess after dependency changes.
#
# Visible upstream warnings (not ignored):
# - RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter unsoundness remains in the
#   Linux GTK3 runtime graph. The fix is in glib >=0.20, which cannot replace
#   GTK3's 0.18 dependency without an upstream migration. Absent on Mac/Windows.
# - RUSTSEC-2026-0370, -0371, -0372: zvariant 5.15.1, zbus_names 4.3.5 and
#   zvariant_derive 5.15.1 maintenance notices remain through Linux zbus 5.
#   Their replacements are in zbus 6; tauri-plugin-opener must migrate upstream.
#   zvariant/zbus_names are runtime dependencies; zvariant_derive is a macro.
#
# Removed obsolete exceptions for instant, fxhash, unic-* and rkyv: these
# packages are no longer locked. The old rand 0.7 warning is also gone.
# Tokio is updated to 1.54.1, fixing RUSTSEC-2026-0386.

[advisories]
ignore = [
    # RUSTSEC-2024-0370 is a maintenance notice, not a specific vulnerability.
    # proc-macro-error 1.0.4 is Linux-only, compile-time code through
    # glib-macros/gtk3-macros. Remove when GTK3 updates its macro dependencies.
    "RUSTSEC-2024-0370",
]
